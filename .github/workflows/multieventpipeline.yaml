name: "Multi event pipeline/workflows" # Name of the pipeline

on:
  push: # Event: Whenever a push is made to the repository on the master branch
    branches:
      - master
      - test

  pull_request: # Event: Whenever a pull request is made to the repo
    branches:
      - master
    types:
      - closed
      - opened

  workflow_dispatch:

jobs:
  on-push: # Job 1
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps: # Step to be excuted in the job
      - name: "Running on master push" # step 1
        run: echo "Running on master push"

  on-pull-request: # Job 2
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps: # Step to be excuted in the job
      - name: "Running on pull request" # step 1
        run: echo "Running on pull request"

  on-workflow-dispatch: # Job
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps: # Step to be excuted in the job
      - name: "Running on workflow_dispatch" # step 1
        run: echo "Running on workflow_dispatch"
